function setLiv(){const q=num(document.getElementById("lq").value),d=document.getElementById("ld").value||today;let p=S.pos.find(x=>x.e=="Livret A");if(!p){p={e:"Livret A",n:"Livret A",t:"",pru:1,px:1};S.pos.push(p)}p.q=q;p.d0=d;p.px=1;p.pru=1;snap();note="Solde du Livret A enregistré.";render()}

function bourse(){const H=t=>`<h2 style="grid-column:1/-1;margin:12px 0 0;font-size:17px">${t}</h2>`,A=alloc(),nt=S.trx.length;return`<div class="grid">${note?`<div class="okm" style="grid-column:1/-1;margin:0">${note}</div>`:""}${sec("cours","Mettre à jour les cours","du "+(S.pd||PH0.d).split("-").reverse().join("/"),qBox())}${H("Court terme")}${sec("liv","Livret A",eur(env("Livret A")),livCard())}${H("Moyen terme")}${sec("moy","Moyen terme",eur(0),'<div class="card" style="grid-column:1/-1"><h2>Moyen terme</h2><div class="mut">Rien pour l’instant.</div></div>')}${H("Long terme (DCA) · "+eur(env("PEA")+env("CTO")))}${sec("tr","Trade Republic",nt?nt+" opération"+(nt>1?"s":""):"à importer",trCard())}${["PEA","CTO"].map(e=>{const P=S.pos.map((p,i)=>[p,i]).filter(([p])=>p.e==e),tot=env(e);return sec(e,e,eur(tot),`<div class="card" style="grid-column:1/-1"><h2>${e} · ${eur(tot)}</h2>${P.length?`<div style="overflow-x:auto"><table class="rt"><tr class="h"><th>Ligne</th><th>Qté</th><th>PRU</th><th>Cours</th><th>Valeur</th><th>+/-</th><th>Poids</th><th>Cible</th><th></th></tr>${P.map(([p,i])=>{const r=A.find(r=>r.e==e&&r.id==pid(p))||{};return`<tr><td class="f">${esc(p.n)}<div class="mut">${esc(p.t||"")}${p.isin?" · "+p.isin:""}${p.src=="tr"?'<em class="tag">Trade Republic</em>':""}</div>${nonPEA(p)?'<div class="red" style="font-size:12px;font-weight:600;margin-top:4px">Non éligible au PEA : vérifie l’enveloppe</div>':""}${isDup(p)?`<div class="red" style="font-size:12px;font-weight:600;margin-top:4px">En double avec la ligne Trade Republic : non comptée <button class="g" onclick="del(${i})">Supprimer la ligne manuelle</button></div>`:""}${p.isin&&!p.t?`<input placeholder="Ticker Yahoo à saisir" onchange="setT(${i},this.value)" style="width:150px;font-size:12px;margin-top:4px" aria-label="Ticker Yahoo">`:""}${p.isin?"":`<select onchange="lnk(${i},this.value)" aria-label="Associer à un actif"><option value="">Associer à un actif…</option>${CAT.map(c=>`<option value="${c.isin}">${esc(c.s)}</option>`).join("")}</select>`}</td><td data-l="Quantité">${fq(p.q)}</td><td data-l="PRU">${eur(p.pru)}</td><td data-l="Cours"><input value="${fpx(p.px)}" inputmode="decimal" onchange="setPx(${i},this.value)" aria-label="Cours"></td><td data-l="Valeur">${eur(val(p))}</td><td data-l="+/-" class="${val(p)>=p.q*p.pru?"pos":"red"}">${p.q*p.pru?fr((val(p)/(p.q*p.pru)-1)*100)+" %":""}</td><td data-l="Poids" class="${r.al?"red":""}">${fr(r.real||0)} %${r.al?" ⚠":""}</td><td data-l="Cible">${r.tg!=null?r.tg+" %":"–"}</td><td class="x"><button class="g" onclick="del(${i})" aria-label="Supprimer la ligne">×</button></td></tr>`}).join("")}</table></div>`:'<div class="mut">Aucune ligne.</div>'}${chart(e)}</div>`)}).join("")}
${sec("add","Ajouter une ligne","",`<div class="card" style="grid-column:1/-1"><h2>Ajouter une ligne</h2><div class="add"><select id="pa" onchange="pick(this.value)" aria-label="Actif"><option value="">Choisir un actif…</option>${CAT.map(c=>`<option value="${c.isin}">${esc(c.s)} · ${c.isin}</option>`).join("")}<option value="x">Autre actif (saisie libre)</option></select><select id="pe" aria-label="Enveloppe"><option>PEA</option><option>CTO</option></select><input id="pq" placeholder="Quantité" inputmode="decimal"><input id="pp" placeholder="PRU en €" inputmode="decimal"><button class="b" onclick="addPos()">Ajouter</button></div><div class="add"><input id="pn" placeholder="Nom" style="width:320px"><input id="pt" placeholder="Ticker Yahoo"></div><div class="mut" id="pw" style="margin-top:8px">Choisis un actif : le nom et le ticker Yahoo se remplissent tout seuls. Il reste la quantité et le prix de revient unitaire.</div></div>`)}</div>`}
function pat(){const L=env("Livret A"),P=env("PEA"),C=env("CTO"),tot=L+P+C,lg=P+C,ci=live().filter(p=>p.e=="PEA"||p.e=="CTO").reduce((u,p)=>u+(p.q||0)*(p.pru||0),0),pl=lg-ci;

function reglages(){return`<div class="grid"><div class="card"><h2>Objectifs mensuels</h2>${["court","moyen","long"].map(k=>`<div class="tools">${SL[k]} <input type="number" min="0" value="${S.goals[k]||0}" onchange="S.goals['${k}']=+this.value||0;save();render()" style="width:100px"> €</div>`).join("")}<div class="mut">Mets 0 pour désactiver un objectif. Le long terme correspond à ton DCA.</div></div>
<div class="card"><h2>Sauvegarde complète</h2><div class="mut" style="margin-bottom:12px">Un seul fichier .json contient tout : opérations, catégories apprises, lignes de bourse, historique, objectifs. Télécharge-le avant chaque nouvelle version de la page, puis restaure-le dedans.</div><div class="tools"><button class="b" onclick="exp()">Télécharger la sauvegarde</button><label class="g">Restaurer une sauvegarde<input type="file" accept=".json" hidden onchange="imp(this)"></label></div>${note?`<div class="mut">${note}</div>`:""}<div class="mut">${S.tx.length} opérations · ${S.pos.length} lignes de bourse · ${Object.keys(S.rules).length} libellés mémorisés</div><div class="tools" style="margin:12px 0 0">${clrc?`<div class="alert" style="margin:0">Effacer les ${S.tx.length} opérations importées ? Lignes de bourse, objectifs et catégories mémorisées sont conservés. <div class="tools" style="margin:8px 0 0"><button class="b" onclick="clrc=false;clr()">Oui, effacer</button><button class="g" onclick="clrc=false;render()">Annuler</button></div></div>`:'<button class="g" onclick="clrc=true;render()">Effacer toutes les opérations</button>'}</div></div><div class="card"><h2>Reconnaissance des virements internes</h2>${S.me?"":`<div class="alert" style="margin:0 0 12px">Saisis ton nom tel qu’il apparaît sur tes virements (ex. « dupont jean ») : c’est ce qui repère tes virements vers et depuis le Livret A.</div>`}<div class="tools">Mon nom sur les virements <input value="${esc(S.me||"")}" onchange="S.me=this.value.trim();save();render()" style="width:260px"></div><div class="mut">Sépare les variantes par une virgule. Un virement qui contient ton nom va au court terme (Livret A). « Livret A » dans la référence → court terme ; « DCA », « Trade Republic » ou « épargne » → long terme.</div><div class="tools" style="margin-top:12px"><button class="g" onclick="reclass()">Reclasser les opérations</button></div>${Object.keys(S.accts).map(a=>`<div class="tools">Compte …${esc(a.slice(-4))} <select onchange="setAcc('${esc(a)}',this.value)"><option value="courant" ${S.accts[a]=="courant"?"selected":""}>Compte courant</option><option value="livret" ${S.accts[a]=="livret"?"selected":""}>Livret A (vérification)</option></select></div>`).join("")}</div>
<div class="card" style="grid-column:1/-1"><h2>Allocations cibles</h2><div class="tools">Pourcentages calculés <select onchange="S.tb=this.value;save();render()" aria-label="Base du pourcentage"><option value="env" ${S.tb=="env"?"selected":""}>dans chaque enveloppe (PEA et CTO séparés)</option><option value="tot" ${S.tb=="tot"?"selected":""}>sur tout le portefeuille bourse</option></select></div><div class="tools">Alerte rouge au-delà d’un écart de <input type="number" min="0" step="0.5" value="${S.tol}" onchange="S.tol=Math.max(0,+this.value||0);save();render()" style="width:80px" aria-label="Écart toléré"> points de pourcentage</div>${S.tg.map((t,i)=>`<div class="tools"><b style="min-width:230px">${esc(cat(t.id)?cat(t.id).s:t.id)}</b><span class="tag" style="margin:0">${t.e}</span><input type="number" min="0" max="100" step="0.5" value="${t.pct}" onchange="setTg(${i},this.value)" style="width:80px" aria-label="Cible en pourcentage"> %<button class="g" onclick="delTg(${i})" aria-label="Supprimer">×</button></div>`).join("")}${Object.entries(tgSum()).map(([k,v])=>`<div class="${Math.abs(v-100)<.01?"pos":"red"}" style="margin-bottom:8px">Total ${k} : ${+v.toFixed(1)} %${Math.abs(v-100)<.01?"":v<100?" (il reste "+(+(100-v).toFixed(1))+" % à attribuer)":" (dépasse 100 %)"}</div>`).join("")}<div class="add"><select id="ta" aria-label="Actif"><option value="">Choisir un actif…</option>${CAT.map(c=>`<option value="${c.isin}">${esc(c.s)}</option>`).join("")}${[...new Map(S.pos.filter(p=>(p.e=="PEA"||p.e=="CTO")&&!cat(p.isin)).map(p=>[pid(p),p.n])).entries()].map(([id,n])=>`<option value="${esc(id)}">${esc(n)}</option>`).join("")}</select><select id="te" aria-label="Enveloppe"><option>PEA</option><option>CTO</option></select><input id="tp" placeholder="Cible en %" inputmode="decimal"><button class="b" onclick="addTg()">Ajouter la cible</button></div><div class="mut" style="margin-top:8px">L’allocation réelle et les écarts s’affichent dans Patrimoine et dans l’onglet Épargne.</div></div>
<div class="card"><h2>Catégories</h2><div class="mut" style="margin-bottom:8px">${CATS.join(" · ")}</div>${S.xc.map((c,i)=>`<div class="tools">${esc(c)} <button class="g" onclick="delCat(${i})" aria-label="Supprimer">×</button></div>`).join("")}<div class="tools"><input id="nc" placeholder="Nouvelle catégorie"><button class="b" onclick="addCat()">Ajouter</button></div></div></div>`}

if(ofx){note=importOFX(t);trN="";render();return}
if(V=="bourse"){note="";trN=tr?importTR(t):"Ce fichier n’est pas un export Trade Republic. Ici : l’export CSV de Trade Republic, ou l’OFX de ta banque.";render();return}
